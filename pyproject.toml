[project]
name = "ha-renpho"
version = "0.1.0"
description = "Home Assistant custom integration for the Renpho Health cloud"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    # Pulls in the matching homeassistant release.
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Oldest Python among supported Home Assistant releases (see hacs.json).
target-version = "py313"
